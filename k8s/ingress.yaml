apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-todo-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: todo.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: django-todo-service
            port:
              number: 80

